
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색</title>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일 */
        * {
            box-sizing: border-box;
        }

        /* 페이지 기본 설정 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* 화면을 좌우 2분할 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background: white;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .description {
            margin: 0 0 20px;
            color: #777;
            font-size: 13px;
        }

        /* 검색창과 검색 버튼 */
        .search-box {
            display: flex;
            gap: 8px;
        }

        #searchInput {
            width: 0;
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 12px 14px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #f1d900;
        }

        /* 검색 상태 메시지 */
        #statusMessage {
            margin: 16px 0 8px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .place-item {
            padding: 15px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f8f8f8;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 16px;
            font-weight: bold;
        }

        .place-category {
            margin-bottom: 6px;
            color: #888;
            font-size: 12px;
        }

        .place-address {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2675d8;
            font-size: 13px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #f2f2f2;
        }

        /* 작은 화면에서는 위아래로 배치 */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 16px;
            }

            #map {
                width: 100%;
                height: 52%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 검색창과 검색 결과 -->
        <aside class="sidebar">
            <h1>장소 찾기</h1>
            <p class="description">
                원하는 장소를 검색해 보세요.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="예: 강남역, 카페, 도서관"
                    aria-label="검색할 장소"
                >
                <button id="searchButton">검색</button>
            </div>

            <p id="statusMessage" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </p>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽: 카카오 지도 -->
        <main id="map" aria-label="장소 검색 지도"></main>
    </div>

    <!-- 카카오 지도 SDK와 장소 검색 라이브러리 불러오기 -->
    <!-- 발급받은 JavaScript 키를 appkey에 입력 -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8a03beb0de917cf3fb930a4a191c7ec3&libraries=services&autoload=false"
        async
    ></script>

    <script>
        // 지도와 검색에 사용할 변수
        let map;
        let places;
        let currentMarker;
        let placeMarkers = [];
        let currentPosition = null;
        let mapReady = false;

        // HTML 요소 가져오기
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const statusMessage = document.getElementById("statusMessage");
        const resultList = document.getElementById("resultList");

        // SDK가 준비되면 지도 초기화
        function waitForKakao() {
            // 카카오 SDK가 아직 준비되지 않았다면 잠시 후 다시 확인
            if (!window.kakao || !window.kakao.maps) {
                setTimeout(waitForKakao, 100);
                return;
            }

            // 지도 API가 준비된 후 초기화 코드를 실행
            kakao.maps.load(initializeMap);
        }

        // 지도 생성
        function initializeMap() {
            // 서울 시청을 기본 위치로 설정
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            const mapContainer = document.getElementById("map");

            // 지도 생성에 필요한 옵션
            const mapOptions = {
                center: defaultPosition,
                level: 5
            };

            // 지도 객체 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);

            // 장소 검색 서비스 생성
            places = new kakao.maps.services.Places(map);

            // 지도 초기화 완료
            mapReady = true;
            statusMessage.textContent =
                "현재 위치를 확인하고 있습니다.";

            // 브라우저에서 현재 위치 확인
            getCurrentLocation();
        }

        // 사용자의 현재 위치 가져오기
        function getCurrentLocation() {
            // 브라우저가 위치 정보를 지원하는지 확인
            if (!navigator.geolocation) {
                statusMessage.textContent =
                    "위치 기능을 지원하지 않아 서울 시청을 표시합니다.";
                return;
            }

            // 위치 권한 요청 및 현재 위치 확인
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도 가져오기
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 현재 위치를 지도 중심으로 설정
                    map.setCenter(currentPosition);

                    // 현재 위치 마커 생성
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    currentMarker = new kakao.maps.Marker({
                        position: currentPosition,
                        map: map
                    });

                    statusMessage.textContent =
                        "현재 위치를 표시했습니다. 장소를 검색해 보세요.";
                },
                function (error) {
                    // 위치 확인에 실패하면 기본 위치를 유지
                    if (error.code === 1) {
                        statusMessage.textContent =
                            "위치 권한이 거부되었습니다. 서울 시청을 기준으로 검색합니다.";
                    } else {
                        statusMessage.textContent =
                            "현재 위치를 확인하지 못했습니다. 서울 시청을 기준으로 검색합니다.";
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 장소 검색 함수
        function searchPlaces() {
            // 지도가 준비되기 전에 검색하지 않도록 확인
            if (!mapReady || !places) {
                statusMessage.textContent =
                    "지도를 불러오는 중입니다. 잠시 기다려 주세요.";
                return;
            }

            // 검색어 앞뒤의 공백 제거
            const keyword = searchInput.value.trim();

            // 검색어가 비어 있는지 확인
            if (!keyword) {
                statusMessage.textContent =
                    "검색할 장소를 입력해 주세요.";
                searchInput.focus();
                return;
            }

            statusMessage.textContent = "장소를 검색하고 있습니다.";
            resultList.replaceChildren();

            // 이전 검색 결과 마커 삭제
            removePlaceMarkers();

            // 입력한 키워드로 장소 검색
            places.keywordSearch(keyword, function (data, status) {
                // 검색 결과가 있는 경우
                if (status === kakao.maps.services.Status.OK) {
                    displayPlaces(data);
                } else if (
                    status === kakao.maps.services.Status.ZERO_RESULT
                ) {
                    statusMessage.textContent =
                        "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
                } else {
                    statusMessage.textContent =
                        "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";
                }
            });
        }

        // 검색 결과 목록과 지도 마커 표시
        function displayPlaces(data) {
            const bounds = new kakao.maps.LatLngBounds();

            statusMessage.textContent =
                "검색 결과 " + data.length + "개";

            data.forEach(function (place, index) {
                // 검색 결과의 좌표 가져오기
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 지도에 장소 마커 생성
                const marker = new kakao.maps.Marker({
                    position: position,
                    map: map
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                // 검색 결과 항목 생성
                const item = document.createElement("article");
                item.className = "place-item";
                item.tabIndex = 0;

                // 장소 이름
                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = (index + 1) + ". " + place.place_name;
                item.appendChild(name);

                // 장소 카테고리
                if (place.category_name) {
                    const category = document.createElement("div");
                    category.className = "place-category";
                    category.textContent = place.category_name;
                    item.appendChild(category);
                }

                // 도로명 주소 또는 지번 주소
                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";
                item.appendChild(address);

                // 전화번호가 있는 경우 표시
                if (place.phone) {
                    const phone = document.createElement("div");
                    phone.className = "place-phone";
                    phone.textContent = place.phone;
                    item.appendChild(phone);
                }

                // 카카오맵 상세 페이지 링크
                const link = document.createElement("a");
                link.className = "place-link";
                link.href = place.place_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "카카오맵에서 보기";
                item.appendChild(link);

                // 검색 결과 항목을 클릭하면 해당 장소로 이동
                item.addEventListener("click", function () {
                    map.panTo(position);
                });

                // 키보드로도 장소를 선택할 수 있도록 설정
                item.addEventListener("keydown", function (event) {
                    if (
                        event.key === "Enter" &&
                        event.target === item
                    ) {
                        map.panTo(position);
                    }
                });

                // 마커를 클릭해도 해당 장소를 중심으로 이동
                kakao.maps.event.addListener(marker, "click", function () {
                    map.panTo(position);
                });

                resultList.appendChild(item);
            });

            // 검색된 장소들이 모두 보이도록 지도 범위 조정
            if (data.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 이전 검색 결과의 마커를 지도에서 제거
        function removePlaceMarkers() {
            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
        }

        // 검색 버튼을 클릭하면 검색 실행
        searchButton.addEventListener("click", searchPlaces);

        // 입력창에서 Enter 키를 눌러도 검색 실행
        searchInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                searchPlaces();
            }
        });

        // 카카오 SDK가 로드된 후 지도 초기화 시작
        waitForKakao();
    </script>
</body>
</html>
