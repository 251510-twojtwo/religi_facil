<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근처 종교 시설 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 500px;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 18px;
      border-bottom: 1px solid #eee;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .search-box {
      display: flex;
      gap: 6px;
      padding: 12px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    button {
      padding: 10px 12px;
      border: 0;
      border-radius: 7px;
      background: #3569d4;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      opacity: 0.88;
    }

    .location-button {
      margin: 0 12px 12px;
      background: #333;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding: 0 12px 12px;
    }

    .tab {
      padding: 10px 3px;
      background: #f0f2f5;
      color: #444;
    }

    .tab.active {
      background: #3569d4;
      color: white;
    }

    .status {
      padding: 10px 13px;
      background: #f7f8fa;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      color: #555;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      padding: 12px 14px 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .result-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px;
    }

    .place-card {
      padding: 13px 7px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-card:hover {
      background: #f5f8ff;
    }

    .place-card h3 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    .place-card p {
      margin: 4px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .place-card .category {
      color: #3569d4;
    }

    .empty-message {
      padding: 24px 10px;
      color: #777;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      border-top: 1px solid #eee;
    }

    .pagination button {
      padding: 8px 11px;
    }

    .pagination button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #pageNumber {
      font-size: 12px;
    }

    /* 오른쪽 지도 영역 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e9edf2;
    }

    .map-help {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      max-width: 240px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 8px;
      box-shadow: 0 2px 6px #0002;
      font-size: 12px;
      line-height: 1.5;
    }

    .map-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .map-controls button {
      box-shadow: 0 2px 6px #0002;
    }

    .info-window {
      min-width: 180px;
      max-width: 250px;
      padding: 12px;
      color: #222;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .info-window strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .info-window a {
      display: inline-block;
      margin-top: 6px;
      color: #3569d4;
    }

    /* 모바일 화면 */
    @media (max-width: 650px) {
      .app {
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }

      .sidebar {
        width: 100%;
        height: 55%;
        min-height: 300px;
      }

      .header {
        padding: 12px 14px;
      }

      .header h1 {
        font-size: 19px;
      }

      .map-area {
        min-height: 180px;
      }

      .map-help {
        max-width: 180px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- 왼쪽 검색 영역 -->
    <aside class="sidebar">
      <header class="header">
        <h1>근처 종교 시설 지도</h1>
        <p>현재 위치 주변에서 원하는 종교 시설을 찾아보세요.</p>
      </header>

      <form class="search-box" id="searchForm">
        <input
          id="searchInput"
          type="text"
          placeholder="시설 이름 또는 검색어 입력"
          aria-label="검색어"
        >
        <button type="submit">검색</button>
      </form>

      <button class="location-button" id="locationButton">
        현재 위치로 이동
      </button>

      <nav class="tabs" aria-label="종교 시설 종류">
        <button type="button" class="tab active" data-tab="temple">절</button>
        <button type="button" class="tab" data-tab="cathedral">성당</button>
        <button type="button" class="tab" data-tab="church">교회</button>
        <button type="button" class="tab" data-tab="other">그 외</button>
      </nav>

      <div class="status" id="statusMessage" role="status">
        지도를 불러오는 중입니다.
      </div>

      <div class="result-heading">
        <span>검색 결과</span>
        <span id="resultCount">0곳</span>
      </div>

      <div class="result-list" id="resultList">
        <div class="empty-message">지도를 불러오는 중입니다.</div>
      </div>

      <div class="pagination">
        <button id="prevButton" disabled>이전</button>
        <span id="pageNumber">1 / 1</span>
        <button id="nextButton" disabled>다음</button>
      </div>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main class="map-area">
      <div id="map"></div>

      <div class="map-help">
        지도 마커 또는 왼쪽 검색 결과를 눌러 시설 정보를 확인하세요.
      </div>

      <div class="map-controls">
        <button id="trafficButton">교통정보 켜기</button>
        <button id="allResultsButton">이 위치에서 다시 검색</button>
      </div>
    </main>
  </div>

  <!-- 카카오 지도 SDK: src에는 URL만 넣어야 함 -->
  <script
    id="kakaoSdk"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e8464b7932c46b8e4dbfb556fec74039&libraries=services&autoload=false"
    async
    onerror="sdkLoadFailed()"
  ></script>

  <script>
    // ==========================================
    // 1. 기본 설정
    // ==========================================

    const statusMessage = document.getElementById("statusMessage");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");
    const pageNumber = document.getElementById("pageNumber");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const searchInput = document.getElementById("searchInput");

    const ITEMS_PER_PAGE = 10;
    const SEARCH_RADIUS = 5000;

    // 기본 위치: 서울시청
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LNG = 126.9780;

    let map = null;
    let placesService = null;
    let infoWindow = null;
    let currentMarker = null;
    let placeMarkers = [];
    let allPlaces = [];
    let currentPage = 1;
    let currentTab = "temple";
    let searchCenter = null;
    let trafficEnabled = false;
    let mapReady = false;
    let searchVersion = 0;
    let customSearch = false;
    let customKeyword = "";
    let userPosition = null;
    let locationResolved = false;
    let sdkFailed = false;

    // 탭별 검색어
    const tabSettings = {
      temple: {
        label: "절",
        keywords: ["절", "사찰", "불교"]
      },
      cathedral: {
        label: "성당",
        keywords: ["성당"]
      },
      church: {
        label: "교회",
        keywords: ["교회"]
      },
      other: {
        label: "그 외 종교 시설",
        keywords: [
          "종교 시설",
          "종교단체",
          "이슬람 사원",
          "모스크",
          "회당"
        ]
      }
    };

    // 탭마다 다른 마커 색상
    const markerColors = {
      temple: "#d97706",
      cathedral: "#2563eb",
      church: "#16a34a",
      other: "#9333ea",
      current: "#e11d48"
    };

    function setStatus(message) {
      statusMessage.textContent = message;
    }

    // SDK 로딩 실패 메시지
    function sdkLoadFailed() {
      sdkFailed = true;
      setStatus(
        "카카오 SDK 로딩에 실패했습니다. JavaScript 키, 허용 도메인, 인터넷 연결을 확인하세요."
      );
    }

    // 화면에 표시할 문자열의 HTML 특수문자 처리
    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }

    // ==========================================
    // 2. 현재 위치 확인
    // ==========================================

    function requestCurrentLocation(showMessage = true) {
      if (!navigator.geolocation) {
        locationResolved = true;
        useDefaultLocation();

        setStatus(
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다. 서울시청을 기준으로 검색합니다."
        );
        return;
      }

      // 위치 기능은 HTTPS 또는 localhost에서 사용 가능
      if (!window.isSecureContext) {
        locationResolved = true;
        useDefaultLocation();

        setStatus(
          "현재 위치 기능은 HTTPS 또는 localhost에서 사용할 수 있습니다. 서울시청을 기준으로 검색합니다."
        );
        return;
      }

      if (showMessage) {
        setStatus("현재 위치 권한을 확인하고 있습니다.");
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          userPosition = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          locationResolved = true;

          if (mapReady) {
            applyUserLocation();
          } else {
            setStatus(
              "현재 위치를 확인했습니다. 지도를 준비하고 있습니다."
            );
          }
        },

        function (error) {
          locationResolved = true;
          console.warn("현재 위치 확인 실패:", error);

          useDefaultLocation();

          if (error.code === 1) {
            setStatus(
              "위치 권한이 거부되었습니다. 브라우저 설정에서 위치를 허용하거나 서울시청 기준으로 검색하세요."
            );
          } else if (error.code === 2) {
            setStatus(
              "현재 위치를 확인할 수 없습니다. 서울시청을 기준으로 검색합니다."
            );
          } else if (error.code === 3) {
            setStatus(
              "위치 확인 시간이 초과되었습니다. 서울시청을 기준으로 검색합니다."
            );
          } else {
            setStatus(
              "위치를 확인할 수 없습니다. 서울시청을 기준으로 검색합니다."
            );
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    function useDefaultLocation() {
      userPosition = {
        lat: DEFAULT_LAT,
        lng: DEFAULT_LNG
      };

      if (mapReady) {
        applyUserLocation();
      }
    }

    function applyUserLocation() {
      if (!mapReady || !userPosition) return;

      const position = new kakao.maps.LatLng(
        userPosition.lat,
        userPosition.lng
      );

      searchCenter = position;
      map.setCenter(position);
      map.setLevel(5);

      if (currentMarker) {
        currentMarker.setMap(null);
      }

      currentMarker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: "현재 위치",
        image: createMarkerImage(markerColors.current)
      });

      setStatus("위치를 설정했습니다. 주변 종교 시설을 검색합니다.");
      searchNearby();
    }

    // ==========================================
    // 3. 카카오 지도 초기화
    // ==========================================

    function initializeMap() {
      if (mapReady) return;

      try {
        const initialPosition = new kakao.maps.LatLng(
          DEFAULT_LAT,
          DEFAULT_LNG
        );

        map = new kakao.maps.Map(
          document.getElementById("map"),
          {
            center: initialPosition,
            level: 5
          }
        );

        placesService = new kakao.maps.services.Places();

        infoWindow = new kakao.maps.InfoWindow({
          zIndex: 10
        });

        searchCenter = initialPosition;
        mapReady = true;

        // 지도를 이동한 뒤 다시 검색할 때 사용할 중심 좌표
        kakao.maps.event.addListener(map, "dragend", function () {
          searchCenter = map.getCenter();
        });

        kakao.maps.event.addListener(map, "zoom_changed", function () {
          searchCenter = map.getCenter();
        });

        if (locationResolved && userPosition) {
          applyUserLocation();
        } else {
          setStatus(
            "지도가 준비되었습니다. 서울시청 주변 시설을 검색합니다."
          );
          searchNearby();
        }
      } catch (error) {
        console.error("지도 초기화 오류:", error);

        setStatus(
          "지도를 초기화하지 못했습니다. JavaScript 키와 카카오 도메인 설정을 확인하세요."
        );
      }
    }

    // SDK가 로딩될 때까지 기다림
    function waitForKakao() {
      let attempts = 0;

      const timer = setInterval(function () {
        attempts++;

        if (
          window.kakao &&
          kakao.maps &&
          typeof kakao.maps.load === "function"
        ) {
          clearInterval(timer);

          kakao.maps.load(function () {
            if (kakao.maps.services) {
              initializeMap();
            } else {
              setStatus(
                "장소 검색 서비스를 불러오지 못했습니다. SDK 주소의 libraries=services 설정을 확인하세요."
              );
            }
          });

          return;
        }

        if (sdkFailed || attempts >= 150) {
          clearInterval(timer);

          if (!sdkFailed) {
            sdkLoadFailed();
          }
        }
      }, 100);
    }

    // ==========================================
    // 4. 마커 이미지 만들기
    // ==========================================

    function createMarkerImage(color) {
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">' +
        '<path d="M16 1 C7.7 1 1 7.7 1 16 C1 26 16 41 16 41 C16 41 31 26 31 16 C31 7.7 24.3 1 16 1Z" fill="' +
        color +
        '" stroke="white" stroke-width="2"/>' +
        '<circle cx="16" cy="16" r="5" fill="white"/>' +
        "</svg>";

      const imageUrl =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(32, 42),
        {
          offset: new kakao.maps.Point(16, 42)
        }
      );
    }

    function clearPlaceMarkers() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      placeMarkers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // ==========================================
    // 5. 키워드 검색
    // ==========================================

    function searchKeyword(keyword, center) {
      return new Promise(function (resolve) {
        placesService.keywordSearch(
          keyword,

          function (data, status) {
            if (status === kakao.maps.services.Status.OK) {
              resolve(data || []);
            } else {
              // 검색어 하나가 실패해도 나머지 검색은 진행
              resolve([]);
            }
          },

          {
            location: center,
            radius: SEARCH_RADIUS,
            sort: kakao.maps.services.SortBy.DISTANCE,
            size: 15
          }
        );
      });
    }

    async function searchNearby() {
      if (!mapReady || !placesService) {
        setStatus("지도를 준비하고 있습니다.");
        return;
      }

      const thisSearchVersion = ++searchVersion;

      searchCenter = map.getCenter();

      clearPlaceMarkers();

      allPlaces = [];
      currentPage = 1;

      renderResults();

      const keywords = customSearch
        ? [customKeyword]
        : tabSettings[currentTab].keywords;

      setStatus("주변 시설을 검색하고 있습니다.");

      try {
        const searchResults = await Promise.all(
          keywords.map(function (keyword) {
            return searchKeyword(keyword, searchCenter);
          })
        );

        // 이전 검색이 늦게 끝나도 현재 결과를 덮어쓰지 않음
        if (thisSearchVersion !== searchVersion) return;

        const uniquePlaces = new Map();

        searchResults.flat().forEach(function (place) {
          if (!place.id) return;

          if (!uniquePlaces.has(place.id)) {
            uniquePlaces.set(place.id, place);
          }
        });

        allPlaces = Array.from(uniquePlaces.values());

        // 지도 중심과 가까운 순서로 정렬
        const centerLat = searchCenter.getLat();
        const centerLng = searchCenter.getLng();

        allPlaces.sort(function (a, b) {
          const distanceA =
            Math.pow(Number(a.y) - centerLat, 2) +
            Math.pow(Number(a.x) - centerLng, 2);

          const distanceB =
            Math.pow(Number(b.y) - centerLat, 2) +
            Math.pow(Number(b.x) - centerLng, 2);

          return distanceA - distanceB;
        });

        renderResults();
        renderMarkers();

        if (allPlaces.length === 0) {
          setStatus(
            "주변에서 검색 결과를 찾지 못했습니다. 지도를 이동하거나 다른 검색어를 입력해 보세요."
          );
        } else {
          setStatus(
            "검색 완료: 주변 시설 " +
            allPlaces.length +
            "곳을 찾았습니다."
          );
        }
      } catch (error) {
        console.error("장소 검색 오류:", error);

        setStatus(
          "장소 검색 중 오류가 발생했습니다. 인터넷 연결과 카카오 설정을 확인하세요."
        );
      }
    }

    // ==========================================
    // 6. 검색 결과를 지도에 표시
    // ==========================================

    function renderMarkers() {
      clearPlaceMarkers();

      const color = markerColors[currentTab] || markerColors.other;

      allPlaces.forEach(function (place) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name,
          image: createMarkerImage(color)
        });

        // 마커를 누르면 시설 정보 표시
        kakao.maps.event.addListener(marker, "click", function () {
          showPlaceInfo(place, marker);
        });

        placeMarkers.push(marker);
      });
    }

    // ==========================================
    // 7. 시설 상세 정보 창
    // ==========================================

    function showPlaceInfo(place, marker) {
      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      const phone = place.phone
        ? "<div>전화: " + escapeHTML(place.phone) + "</div>"
        : "";

      const placeUrl = place.place_url || "";

      const link = placeUrl
        ? '<a href="' +
          escapeHTML(placeUrl) +
          '" target="_blank" rel="noopener noreferrer">카카오맵에서 보기</a>'
        : "";

      const content =
        '<div class="info-window">' +
        "<strong>" +
        escapeHTML(place.place_name) +
        "</strong>" +
        "<div>" +
        escapeHTML(address) +
        "</div>" +
        phone +
        link +
        "</div>";

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // ==========================================
    // 8. 왼쪽 검색 결과 목록
    // ==========================================

    function renderResults() {
      resultList.innerHTML = "";

      resultCount.textContent = allPlaces.length + "곳";

      const totalPages = Math.max(
        1,
        Math.ceil(allPlaces.length / ITEMS_PER_PAGE)
      );

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      pageNumber.textContent =
        currentPage + " / " + totalPages;

      prevButton.disabled = currentPage <= 1;
      nextButton.disabled = currentPage >= totalPages;

      if (allPlaces.length === 0) {
        resultList.innerHTML =
          '<div class="empty-message">검색 결과가 없습니다.<br>다른 검색어를 입력하거나 지도를 이동해 보세요.</div>';
        return;
      }

      const start = (currentPage - 1) * ITEMS_PER_PAGE;

      const pagePlaces = allPlaces.slice(
        start,
        start + ITEMS_PER_PAGE
      );

      pagePlaces.forEach(function (place) {
        const card = document.createElement("div");
        card.className = "place-card";

        const address =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        card.innerHTML =
          "<h3>" +
          escapeHTML(place.place_name) +
          "</h3>" +
          '<p class="category">' +
          escapeHTML(tabSettings[currentTab].label) +
          "</p>" +
          "<p>" +
          escapeHTML(address) +
          "</p>" +
          (
            place.phone
              ? "<p>전화: " + escapeHTML(place.phone) + "</p>"
              : ""
          );

        card.addEventListener("click", function () {
          const position = new kakao.maps.LatLng(
            Number(place.y),
            Number(place.x)
          );

          map.panTo(position);

          // 현재 장소의 마커를 찾아 정보 창 열기
          const marker = placeMarkers.find(function (item) {
            return item.getTitle() === place.place_name;
          });

          if (marker) {
            showPlaceInfo(place, marker);
          }
        });

        resultList.appendChild(card);
      });
    }

    // ==========================================
    // 9. 종교 시설 탭 변경
    // ==========================================

    document.querySelectorAll(".tab").forEach(function (button) {
      button.addEventListener("click", function () {
        currentTab = button.dataset.tab;

        // 탭을 바꾸면 직접 검색 모드를 해제
        customSearch = false;
        customKeyword = "";
        searchInput.value = "";

        document.querySelectorAll(".tab").forEach(function (tab) {
          tab.classList.remove("active");
        });

        button.classList.add("active");

        if (mapReady) {
          searchNearby();
        } else {
          setStatus("지도를 준비하고 있습니다.");
        }
      });
    });

    // ==========================================
    // 10. 검색창으로 직접 검색
    // ==========================================

    document.getElementById("searchForm").addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const keyword = searchInput.value.trim();

        if (!keyword) {
          setStatus("검색어를 입력해 주세요.");
          return;
        }

        customSearch = true;
        customKeyword = keyword;

        if (mapReady) {
          searchNearby();
        } else {
          setStatus(
            "지도를 준비하고 있습니다. 잠시 후 다시 검색해 주세요."
          );
        }
      }
    );

    // ==========================================
    // 11. 현재 위치 버튼
    // ==========================================

    document.getElementById("locationButton").addEventListener(
      "click",
      function () {
        requestCurrentLocation(true);
      }
    );

    // ==========================================
    // 12. 페이지 이동
    // ==========================================

    prevButton.addEventListener("click", function () {
      if (currentPage > 1) {
        currentPage--;
        renderResults();
        resultList.scrollTop = 0;
      }
    });

    nextButton.addEventListener("click", function () {
      const totalPages = Math.ceil(
        allPlaces.length / ITEMS_PER_PAGE
      );

      if (currentPage < totalPages) {
        currentPage++;
        renderResults();
        resultList.scrollTop = 0;
      }
    });

    // ==========================================
    // 13. 교통정보 레이어
    // ==========================================

    document.getElementById("trafficButton").addEventListener(
      "click",
      function () {
        if (!mapReady) {
          setStatus("지도를 준비하고 있습니다.");
          return;
        }

        const trafficType = kakao.maps.MapTypeId.TRAFFIC;

        // SDK에서 교통정보 레이어를 지원하지 않는 경우
        if (!trafficType) {
          setStatus(
            "현재 지도 SDK에서 교통정보 레이어를 사용할 수 없습니다."
          );
          return;
        }

        trafficEnabled = !trafficEnabled;

        if (trafficEnabled) {
          map.addOverlayMapTypeId(trafficType);
          this.textContent = "교통정보 끄기";
          setStatus("교통정보 레이어를 켰습니다.");
        } else {
          map.removeOverlayMapTypeId(trafficType);
          this.textContent = "교통정보 켜기";
          setStatus("교통정보 레이어를 껐습니다.");
        }
      }
    );

    // ==========================================
    // 14. 지도 중심 기준 재검색
    // ==========================================

    document.getElementById("allResultsButton").addEventListener(
      "click",
      function () {
        if (!mapReady) {
          setStatus("지도를 준비하고 있습니다.");
          return;
        }

        customSearch = false;
        customKeyword = "";
        searchInput.value = "";

        searchCenter = map.getCenter();

        searchNearby();
      }
    );

    // ==========================================
    // 15. 프로그램 시작
    // ==========================================

    // 지도 SDK가 로딩되는 동안에도 위치 권한을 요청
    requestCurrentLocation(false);

    // 카카오 지도 SDK 로딩 시작
    waitForKakao();
  </script>
</body>
</html>
