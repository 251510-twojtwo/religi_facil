
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주변 종교시설 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
      background: #f5f6f8;
    }

    .app {
      display: flex;
      height: 100vh;
      min-height: 600px;
    }

    /* 왼쪽 검색 패널 */
    .sidebar {
      width: 390px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid #eee;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .search-area {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 13px;
    }

    .primary-btn {
      padding: 0 15px;
      color: white;
      background: #3867e8;
      font-weight: bold;
    }

    .location-btn {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      background: #eef2ff;
      color: #3157c5;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 13px 16px;
      border-bottom: 1px solid #eee;
    }

    .filter-btn {
      padding: 8px 11px;
      background: #f0f1f4;
      color: #555;
    }

    .filter-btn.active {
      background: #3867e8;
      color: white;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
    }

    .result-heading strong {
      font-size: 15px;
    }

    #resultCount {
      color: #777;
      font-size: 12px;
    }

    #status {
      padding: 0 16px 10px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    #results {
      flex: 1;
      overflow-y: auto;
    }

    .place-card {
      padding: 15px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s;
    }

    .place-card:hover {
      background: #f7f8fc;
    }

    .place-card.selected {
      background: #edf2ff;
      border-left: 4px solid #3867e8;
      padding-left: 12px;
    }

    .place-card h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }

    .place-type {
      display: inline-block;
      margin-bottom: 7px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #edf2ff;
      color: #3157c5;
      font-size: 11px;
    }

    .place-card p {
      margin: 4px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-card a {
      display: inline-block;
      margin-top: 8px;
      color: #3867e8;
      font-size: 12px;
      text-decoration: none;
    }

    .empty {
      padding: 30px 20px;
      color: #777;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    /* 오른쪽 지도 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e9edf2;
    }

    .map-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1;
    }

    .map-btn {
      padding: 11px 13px;
      background: white;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px #00000015;
    }

    .map-btn.active {
      color: white;
      background: #3867e8;
    }

    #mapError {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #f5f6f8;
      text-align: center;
      line-height: 1.7;
      z-index: 3;
    }

    #mapError.visible {
      display: flex;
    }

    @media (max-width: 760px) {
      .app {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .sidebar {
        width: 100%;
        height: 55vh;
        min-height: 360px;
      }

      .map-area {
        height: 45vh;
        min-height: 320px;
      }
    }
  </style>

  <!-- 카카오 지도 JavaScript 키가 입력된 부분 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e8464b7932c46b8e4dbfb556fec74039&libraries=services&autoload=false"></script>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <header class="header">
        <h1>주변 종교시설 찾기</h1>
        <p>지도에서 주변의 교회, 성당, 절 등 종교시설을 찾아보세요.</p>
      </header>

      <section class="search-area">
        <div class="search-row">
          <input
            id="searchInput"
            type="text"
            placeholder="장소명 또는 주소 검색"
            aria-label="장소명 또는 주소 검색"
          />
          <button class="primary-btn" id="searchBtn">검색</button>
        </div>

        <button class="location-btn" id="locationBtn">
          현재 위치에서 찾기
        </button>
      </section>

      <nav class="filters" aria-label="종교시설 종류">
        <button class="filter-btn active" data-type="all">전체</button>
        <button class="filter-btn" data-type="church">교회</button>
        <button class="filter-btn" data-type="cathedral">성당</button>
        <button class="filter-btn" data-type="temple">절·사찰</button>
        <button class="filter-btn" data-type="other">그 외</button>
      </nav>

      <div class="result-heading">
        <strong>검색 결과</strong>
        <span id="resultCount">0곳</span>
      </div>

      <div id="status">지도를 불러오는 중입니다.</div>
      <div id="results">
        <div class="empty">지도가 준비되면 주변 시설을 검색할 수 있어요.</div>
      </div>
    </aside>

    <main class="map-area">
      <div id="map"></div>

      <div class="map-controls">
        <button class="map-btn" id="trafficBtn">교통정보 표시</button>
        <button class="map-btn" id="centerBtn">지도 중심으로</button>
      </div>

      <div id="mapError">
        <div>
          <strong>지도를 불러오지 못했어요.</strong>
          <p>
            카카오 개발자 사이트에서 JavaScript 키와 웹 플랫폼 도메인 설정을
            확인해 주세요.<br />
            자세한 내용은 아래 안내를 참고하면 됩니다.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ---------------------------
    // 1. 기본 설정
    // ---------------------------

    const DEFAULT_CENTER = {
      lat: 37.5665,
      lng: 126.9780
    };

    const SEARCH_RADIUS = 5000;

    let map;
    let placesService;
    let currentCenter = new kakao.maps.LatLng(
      DEFAULT_CENTER.lat,
      DEFAULT_CENTER.lng
    );

    let activeType = "all";
    let allPlaces = [];
    let visiblePlaces = [];
    let markers = [];
    let selectedPlaceId = null;
    let trafficVisible = false;
    let infoWindow = null;

    const resultsElement = document.getElementById("results");
    const statusElement = document.getElementById("status");
    const countElement = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const mapError = document.getElementById("mapError");

    // 각 탭에서 검색할 키워드
    const SEARCH_KEYWORDS = {
      all: ["교회", "성당", "절", "사찰", "기도원", "원불교"],
      church: ["교회"],
      cathedral: ["성당"],
      temple: ["절", "사찰"],
      other: ["기도원", "원불교", "수도원"]
    };

    // ---------------------------
    // 2. 지도 초기화
    // ---------------------------

    function initializeMap() {
      if (!window.kakao || !kakao.maps || !kakao.maps.services) {
        showMapError();
        return;
      }

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: currentCenter,
        level: 5
      });

      placesService = new kakao.maps.services.Places();

      infoWindow = new kakao.maps.InfoWindow({
        removable: true
      });

      statusElement.textContent = "주변 종교시설을 검색하고 있습니다.";
      searchNearby();
    }

    function showMapError() {
      mapError.classList.add("visible");
      statusElement.textContent =
        "지도 로딩 실패: API 키와 웹 플랫폼 설정을 확인해 주세요.";
      resultsElement.innerHTML = `
        <div class="empty">
          카카오 지도 SDK를 불러오지 못했습니다.<br /><br />
          1. JavaScript 키가 올바른지 확인<br />
          2. 웹 플랫폼에 현재 접속 주소 등록<br />
          3. 로컬 실행 시 localhost 주소 사용
        </div>
      `;
    }

    if (window.kakao && kakao.maps && typeof kakao.maps.load === "function") {
      kakao.maps.load(initializeMap);
    } else {
      showMapError();
    }

    // ---------------------------
    // 3. 키워드 검색
    // ---------------------------

    function searchKeyword(keyword) {
      return new Promise((resolve) => {
        placesService.keywordSearch(
          keyword,
          (data, status) => {
            if (status === kakao.maps.services.Status.OK) {
              resolve(data || []);
            } else {
              // 한 키워드 검색이 실패해도 나머지 검색은 계속 진행
              resolve([]);
            }
          },
          {
            location: currentCenter,
            radius: SEARCH_RADIUS,
            sort: kakao.maps.services.SortBy.DISTANCE
          }
        );
      });
    }

    async function searchNearby() {
      if (!placesService) return;

      statusElement.textContent = "주변 시설을 검색하고 있습니다.";
      resultsElement.innerHTML =
        '<div class="empty">검색 중입니다. 잠시만 기다려 주세요.</div>';

      clearMarkers();
      allPlaces = [];
      visiblePlaces = [];
      selectedPlaceId = null;
      infoWindow.close();

      const keywords = SEARCH_KEYWORDS[activeType];

      try {
        const searchResults = await Promise.all(
          keywords.map((keyword) => searchKeyword(keyword))
        );

        const placeMap = new Map();

        searchResults.flat().forEach((place) => {
          if (place.id && !placeMap.has(place.id)) {
            placeMap.set(place.id, place);
          }
        });

        allPlaces = Array.from(placeMap.values());

        // 현재 위치에서 가까운 순서로 정렬
        allPlaces.sort((a, b) => {
          const distanceA = Number(a.distance || Infinity);
          const distanceB = Number(b.distance || Infinity);
          return distanceA - distanceB;
        });

        visiblePlaces = allPlaces;
        renderResults();
        renderMarkers();

        if (visiblePlaces.length > 0) {
          statusElement.textContent =
            "현재 지도 중심에서 반경 약 5km 이내의 검색 결과입니다.";
        } else {
          statusElement.textContent =
            "검색 결과가 없어요. 지도 중심을 옮기거나 다른 종류를 선택해 보세요.";
        }
      } catch (error) {
        console.error(error);
        statusElement.textContent = "검색 중 문제가 발생했습니다.";
        resultsElement.innerHTML =
          '<div class="empty">검색에 실패했습니다. 잠시 후 다시 시도해 주세요.</div>';
      }
    }

    // ---------------------------
    // 4. 검색 결과 목록
    // ---------------------------

    function renderResults() {
      countElement.textContent = `${visiblePlaces.length}곳`;

      if (visiblePlaces.length === 0) {
        resultsElement.innerHTML = `
          <div class="empty">
            주변에서 검색 결과를 찾지 못했어요.<br />
            다른 종류를 선택하거나 위치를 바꿔 보세요.
          </div>
        `;
        return;
      }

      resultsElement.innerHTML = visiblePlaces.map((place) => {
        const category = getPlaceType(place);
        const selectedClass =
          selectedPlaceId === place.id ? "selected" : "";

        const address =
          place.road_address_name || place.address_name || "주소 정보 없음";

        const distance = place.distance
          ? `${Number(place.distance).toLocaleString()}m`
          : "거리 정보 없음";

        const placeUrl = place.place_url || "#";

        return `
          <article
            class="place-card ${selectedClass}"
            data-id="${escapeHtml(place.id)}"
            tabindex="0"
            role="button"
            aria-label="${escapeHtml(place.place_name)} 위치 보기"
          >
            <h3>${escapeHtml(place.place_name)}</h3>
            <span class="place-type">${escapeHtml(category)}</span>
            <p>${escapeHtml(address)}</p>
            <p>거리: ${escapeHtml(distance)}</p>
            ${
              place.phone
                ? `<p>전화: ${escapeHtml(place.phone)}</p>`
                : ""
            }
            ${
              placeUrl !== "#"
                ? `<a href="${escapeHtml(placeUrl)}" target="_blank" rel="noopener noreferrer">카카오맵에서 보기 ↗</a>`
                : ""
            }
          </article>
        `;
      }).join("");

      resultsElement.querySelectorAll(".place-card").forEach((card) => {
        const openCard = (event) => {
          if (event.target.closest("a")) return;
          const place = visiblePlaces.find(
            (item) => item.id === card.dataset.id
          );
          if (place) selectPlace(place);
        };

        card.addEventListener("click", openCard);

        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openCard(event);
          }
        });
      });
    }

    function getPlaceType(place) {
      const text = (
        (place.place_name || "") + " " +
        (place.category_name || "")
      ).toLowerCase();

      if (text.includes("성당")) return "성당";
      if (text.includes("교회")) return "교회";
      if (text.includes("사찰") || text.includes("절")) return "절·사찰";
      if (
        text.includes("기도원") ||
        text.includes("원불교") ||
        text.includes("수도원")
      ) return "그 외 종교시설";

      return "종교시설";
    }

    // HTML에 검색 결과를 넣을 때 문자가 코드로 해석되지 않도록 처리
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return entities[char];
      });
    }

    // ---------------------------
    // 5. 지도 마커
    // ---------------------------

    function clearMarkers() {
      markers.forEach((marker) => marker.setMap(null));
      markers = [];
    }

    function renderMarkers() {
      clearMarkers();

      visiblePlaces.forEach((place) => {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        const marker = new kakao.maps.Marker({
          map,
          position,
          title: place.place_name
        });

        kakao.maps.event.addListener(marker, "click", () => {
          selectPlace(place);
        });

        markers.push(marker);
      });
    }

    function selectPlace(place) {
      selectedPlaceId = place.id;

      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.panTo(position);

      const marker = markers.find((item) => {
        const markerPosition = item.getPosition();
        return (
          Math.abs(markerPosition.getLat() - Number(place.y)) < 0.000001 &&
          Math.abs(markerPosition.getLng() - Number(place.x)) < 0.000001
        );
      });

      const content = `
        <div style="padding:12px;max-width:240px;font-size:13px;line-height:1.5;">
          <strong>${escapeHtml(place.place_name)}</strong>
          <div style="margin-top:5px;color:#666;">
            ${escapeHtml(place.road_address_name || place.address_name || "주소 정보 없음")}
          </div>
          ${
            place.place_url
              ? `<a href="${escapeHtml(place.place_url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:7px;color:#3867e8;">상세 정보 보기</a>`
              : ""
          }
        </div>
      `;

      infoWindow.setContent(content);

      if (marker) {
        infoWindow.open(map, marker);
      }

      renderResults();
    }

    // ---------------------------
    // 6. 장소명 및 주소 검색
    // ---------------------------

    function searchByText() {
      const query = searchInput.value.trim();

      if (!query) {
        statusElement.textContent = "검색할 장소명이나 주소를 입력해 주세요.";
        searchInput.focus();
        return;
      }

      if (!placesService) return;

      statusElement.textContent = `"${query}" 검색 중입니다.`;

      placesService.keywordSearch(query, (data, status) => {
        if (
          status !== kakao.maps.services.Status.OK ||
          !data ||
          data.length === 0
        ) {
          statusElement.textContent = "검색 결과가 없습니다.";
          return;
        }

        const first = data[0];

        currentCenter = new kakao.maps.LatLng(
          Number(first.y),
          Number(first.x)
        );

        map.setCenter(currentCenter);
        map.setLevel(4);

        // 검색된 장소를 지도 중심으로 바꾼 후 주변 종교시설 검색
        searchNearby();
      });
    }

    document.getElementById("searchBtn").addEventListener(
      "click",
      searchByText
    );

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") searchByText();
    });

    // ---------------------------
    // 7. 종교시설 필터
    // ---------------------------

    document.querySelectorAll(".filter-btn").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((item) => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        activeType = button.dataset.type;

        searchNearby();
      });
    });

    // ---------------------------
    // 8. 현재 위치
    // ---------------------------

    document.getElementById("locationBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다.";
        return;
      }

      statusElement.textContent =
        "현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentCenter = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentCenter);
          map.setLevel(5);
          searchNearby();
        },
        (error) => {
          console.error(error);
          statusElement.textContent =
            "현재 위치를 가져오지 못했습니다. 브라우저의 위치 권한과 접속 환경을 확인해 주세요.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    });

    // ---------------------------
    // 9. 지도 중심으로 돌아가기
    // ---------------------------

    document.getElementById("centerBtn").addEventListener("click", () => {
      if (!map) return;
      map.setCenter(currentCenter);
      map.setLevel(5);
    });

    // ---------------------------
    // 10. 교통정보 표시
    // ---------------------------

    document.getElementById("trafficBtn").addEventListener("click", () => {
      if (!map) return;

      const trafficButton = document.getElementById("trafficBtn");
      const trafficType = kakao.maps.MapTypeId.TRAFFIC;

      if (!trafficType) {
        statusElement.textContent =
          "현재 SDK에서 교통정보 기능을 사용할 수 없습니다.";
        return;
      }

      if (!trafficVisible) {
        map.addOverlayMapTypeId(trafficType);
        trafficVisible = true;
        trafficButton.classList.add("active");
        trafficButton.textContent = "교통정보 숨기기";
      } else {
        map.removeOverlayMapTypeId(trafficType);
        trafficVisible = false;
        trafficButton.classList.remove("active");
        trafficButton.textContent = "교통정보 표시";
      }
    });
  </script>
</body>
</html>
