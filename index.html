
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주변 종교시설 찾기</title>

  <!-- Kakao Maps SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e8464b7932c46b8e4dbfb556fec74039&libraries=services&autoload=false"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
      background: #f5f6f8;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 600px;
    }

    /* 왼쪽 검색 패널 */
    .sidebar {
      width: 390px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid #eee;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .search-area {
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 13px;
    }

    .primary-btn {
      padding: 0 15px;
      color: white;
      background: #3867e8;
      font-weight: bold;
    }

    .location-btn {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      background: #eef2ff;
      color: #3157c5;
    }

    /* 종류별 필터 */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 13px 16px;
      border-bottom: 1px solid #eee;
    }

    .filter-btn {
      padding: 8px 11px;
      background: #f0f1f4;
      color: #555;
    }

    .filter-btn.active {
      background: #3867e8;
      color: white;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
    }

    .result-heading strong {
      font-size: 15px;
    }

    #resultCount {
      color: #777;
      font-size: 12px;
    }

    #status {
      padding: 0 16px 10px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    #results {
      flex: 1;
      overflow-y: auto;
    }

    .place-card {
      padding: 15px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s;
    }

    .place-card:hover {
      background: #f7f8fc;
    }

    .place-card.selected {
      background: #edf2ff;
      border-left: 4px solid #3867e8;
      padding-left: 12px;
    }

    .place-card h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }

    .place-type {
      display: inline-block;
      margin-bottom: 7px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #edf2ff;
      color: #3157c5;
      font-size: 11px;
    }

    .place-type.church {
      color: #2865bd;
      background: #e8f1ff;
    }

    .place-type.cathedral {
      color: #7847b5;
      background: #f1e8ff;
    }

    .place-type.temple {
      color: #a96716;
      background: #fff0db;
    }

    .place-type.other {
      color: #217d69;
      background: #e1f6ef;
    }

    .place-card p {
      margin: 4px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-card a {
      display: inline-block;
      margin-top: 8px;
      color: #3867e8;
      font-size: 12px;
      text-decoration: none;
    }

    .empty {
      padding: 30px 20px;
      color: #777;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    /* 지도 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e9edf2;
    }

    .map-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1;
    }

    .map-btn {
      padding: 11px 13px;
      background: white;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px #00000015;
    }

    .map-btn.active {
      color: white;
      background: #3867e8;
    }

    /* 지도 범례 */
    .legend {
      position: absolute;
      right: 15px;
      bottom: 25px;
      padding: 14px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 2px 8px #00000018;
      font-size: 12px;
      z-index: 1;
    }

    .legend-title {
      margin-bottom: 9px;
      font-weight: bold;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .legend-icon {
      width: 25px;
      height: 25px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      color: white;
      font-weight: bold;
    }

    .legend-icon.church {
      background: #3478D4;
    }

    .legend-icon.cathedral {
      background: #8B5CC7;
    }

    .legend-icon.temple {
      background: #D18A36;
    }

    .legend-icon.other {
      background: #329B83;
    }

    #mapError {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #f5f6f8;
      text-align: center;
      line-height: 1.7;
      z-index: 3;
    }

    #mapError.visible {
      display: flex;
    }

    @media (max-width: 760px) {
      .app {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .sidebar {
        width: 100%;
        height: 55vh;
        min-height: 360px;
      }

      .map-area {
        height: 45vh;
        min-height: 320px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <header class="header">
        <h1>주변 종교시설 찾기</h1>
        <p>지도에서 주변의 교회, 성당, 절 등 종교시설을 찾아보세요.</p>
      </header>

      <section class="search-area">
        <div class="search-row">
          <input
            id="searchInput"
            type="text"
            placeholder="장소명 또는 주소 검색"
            aria-label="장소명 또는 주소 검색"
          />
          <button class="primary-btn" id="searchBtn">검색</button>
        </div>

        <button class="location-btn" id="locationBtn">
          현재 위치에서 찾기
        </button>
      </section>

      <nav class="filters" aria-label="종교시설 종류">
        <button class="filter-btn active" data-type="all">전체</button>
        <button class="filter-btn" data-type="church">교회</button>
        <button class="filter-btn" data-type="cathedral">성당</button>
        <button class="filter-btn" data-type="temple">절·사찰</button>
        <button class="filter-btn" data-type="other">그 외</button>
      </nav>

      <div class="result-heading">
        <strong>검색 결과</strong>
        <span id="resultCount">0곳</span>
      </div>

      <div id="status">지도를 불러오는 중입니다.</div>

      <div id="results">
        <div class="empty">지도를 준비하고 있습니다.</div>
      </div>
    </aside>

    <main class="map-area">
      <div id="map"></div>

      <div class="map-controls">
        <button class="map-btn" id="trafficBtn">교통정보 표시</button>
        <button class="map-btn" id="centerBtn">지도 중심으로</button>
      </div>

      <div class="legend">
        <div class="legend-title">마커 안내</div>
        <div class="legend-item">
          <span class="legend-icon church">✝</span> 교회
        </div>
        <div class="legend-item">
          <span class="legend-icon cathedral">♜</span> 성당
        </div>
        <div class="legend-item">
          <span class="legend-icon temple">⌂</span> 절·사찰
        </div>
        <div class="legend-item">
          <span class="legend-icon other">✦</span> 그 외
        </div>
      </div>

      <div id="mapError">
        <div>
          <strong>지도를 불러오지 못했어요.</strong>
          <p>
            카카오 개발자 사이트에서 JavaScript 키와 웹 플랫폼 도메인을
            확인해 주세요.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    // =====================================
    // 1. 기본 설정
    // =====================================

    const DEFAULT_CENTER = {
      lat: 37.5665,
      lng: 126.9780
    };

    const SEARCH_RADIUS = 5000;

    let map = null;
    let placesService = null;
    let infoWindow = null;

    let currentCenter = null;
    let activeType = "all";
    let allPlaces = [];
    let visiblePlaces = [];
    let markers = [];
    let selectedPlaceId = null;
    let trafficVisible = false;

    const resultsElement = document.getElementById("results");
    const statusElement = document.getElementById("status");
    const countElement = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const mapError = document.getElementById("mapError");

    const SEARCH_KEYWORDS = {
      all: ["교회", "성당", "절", "사찰", "기도원", "원불교"],
      church: ["교회"],
      cathedral: ["성당"],
      temple: ["절", "사찰"],
      other: ["기도원", "원불교", "수도원"]
    };

    // =====================================
    // 2. 종교시설 종류 판별
    // =====================================

    function getMarkerType(place) {
      const text = (
        (place.place_name || "") + " " +
        (place.category_name || "")
      ).toLowerCase();

      // 성당을 먼저 확인해야 이름에 포함된 단어가
      // 다른 분류로 잘못 인식되는 일을 줄일 수 있음
      if (
        text.includes("성당") ||
        text.includes("천주교") ||
        text.includes("가톨릭")
      ) {
        return "cathedral";
      }

      if (
        text.includes("교회") ||
        text.includes("기독교")
      ) {
        return "church";
      }

      if (
        text.includes("사찰") ||
        text.includes("절") ||
        text.includes("불교")
      ) {
        return "temple";
      }

      return "other";
    }

    function getTypeLabel(type) {
      const labels = {
        church: "교회",
        cathedral: "성당",
        temple: "절·사찰",
        other: "그 외 종교시설"
      };

      return labels[type] || "종교시설";
    }

    // =====================================
    // 3. 종류별 SVG 마커 생성
    // =====================================

    function createMarkerImage(place) {
      const type = getMarkerType(place);

      const designs = {
        church: {
          color: "#3478D4",
          icon: `
            <path d="M21 10V4H17V10H11V14H17V21H21V14H27V10Z"
              fill="white"/>
          `
        },

        cathedral: {
          color: "#8B5CC7",
          icon: `
            <path d="M9 29V14L15 8L21 14V29Z" fill="white"/>
            <path d="M23 29V14L29 8L35 14V29Z" fill="white"/>
            <path d="M19 29V18H25V29Z" fill="white"/>
            <path d="M21 7V2H23V7M19 4H25V6H19Z" fill="white"/>
          `
        },

        temple: {
          color: "#D18A36",
          icon: `
            <path d="M5 15L22 5L39 15Z" fill="white"/>
            <path d="M8 17H36V20H8Z" fill="white"/>
            <path d="M11 21H33V24H11Z" fill="white"/>
            <path d="M13 24H16V33H13ZM21 24H24V33H21ZM29 24H32V33H29Z"
              fill="white"/>
            <path d="M7 34H37V37H7Z" fill="white"/>
          `
        },

        other: {
          color: "#329B83",
          icon: `
            <path d="M22 5L26 16L38 16L29 23L33 35L22 28L11 35L15 23L6 16L18 16Z"
              fill="white"/>
          `
        }
      };

      const design = designs[type];

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
          width="44" height="52" viewBox="0 0 44 52">

          <path
            d="M22 50C18 42 4 29 4 20A18 18 0 1 1 40 20C40 29 26 42 22 50Z"
            fill="${design.color}"
            stroke="white"
            stroke-width="2"
          />

          <circle
            cx="22"
            cy="20"
            r="14"
            fill="${design.color}"
          />

          <g transform="translate(0,2)">
            ${design.icon}
          </g>
        </svg>
      `;

      const imageUrl =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(44, 52),
        {
          offset: new kakao.maps.Point(22, 50)
        }
      );
    }

    // =====================================
    // 4. 지도 초기화
    // =====================================

    function initializeMap() {
      if (
        !window.kakao ||
        !kakao.maps ||
        !kakao.maps.services
      ) {
        showMapError();
        return;
      }

      currentCenter = new kakao.maps.LatLng(
        DEFAULT_CENTER.lat,
        DEFAULT_CENTER.lng
      );

      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: currentCenter,
          level: 5
        }
      );

      placesService = new kakao.maps.services.Places();

      infoWindow = new kakao.maps.InfoWindow({
        removable: true
      });

      statusElement.textContent = "주변 종교시설을 검색하고 있습니다.";
      searchNearby();
    }

    function showMapError() {
      mapError.classList.add("visible");

      statusElement.textContent =
        "지도 로딩 실패: API 키와 웹 플랫폼 설정을 확인해 주세요.";

      resultsElement.innerHTML = `
        <div class="empty">
          카카오 지도 SDK를 불러오지 못했습니다.<br /><br />
          1. JavaScript 키 확인<br />
          2. 웹 플랫폼 도메인 등록<br />
          3. localhost 또는 HTTPS 환경에서 실행
        </div>
      `;
    }

    // =====================================
    // 5. 장소 검색
    // =====================================

    function searchKeyword(keyword) {
      return new Promise((resolve) => {
        placesService.keywordSearch(
          keyword,
          (data, status) => {
            if (status === kakao.maps.services.Status.OK) {
              resolve(data || []);
            } else {
              resolve([]);
            }
          },
          {
            location: currentCenter,
            radius: SEARCH_RADIUS,
            sort: kakao.maps.services.SortBy.DISTANCE
          }
        );
      });
    }

    async function searchNearby() {
      if (!placesService) return;

      statusElement.textContent = "주변 시설을 검색하고 있습니다.";
      resultsElement.innerHTML =
        '<div class="empty">검색 중입니다. 잠시만 기다려 주세요.</div>';

      clearMarkers();
      allPlaces = [];
      visiblePlaces = [];
      selectedPlaceId = null;

      if (infoWindow) {
        infoWindow.close();
      }

      const keywords = SEARCH_KEYWORDS[activeType];

      try {
        const searchResults = await Promise.all(
          keywords.map((keyword) => searchKeyword(keyword))
        );

        const placeMap = new Map();

        searchResults.flat().forEach((place) => {
          if (place.id && !placeMap.has(place.id)) {
            placeMap.set(place.id, place);
          }
        });

        allPlaces = Array.from(placeMap.values());

        allPlaces.sort((a, b) => {
          return Number(a.distance || Infinity) -
                 Number(b.distance || Infinity);
        });

        visiblePlaces = allPlaces;

        renderResults();
        renderMarkers();

        statusElement.textContent = visiblePlaces.length
          ? "지도 중심에서 반경 약 5km 이내의 검색 결과입니다."
          : "검색 결과가 없어요. 다른 종류를 선택하거나 위치를 바꿔 보세요.";

      } catch (error) {
        console.error(error);

        statusElement.textContent = "검색 중 문제가 발생했습니다.";

        resultsElement.innerHTML =
          '<div class="empty">검색에 실패했습니다. 잠시 후 다시 시도해 주세요.</div>';
      }
    }

    // =====================================
    // 6. 검색 결과 목록 표시
    // =====================================

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }

    function renderResults() {
      countElement.textContent = `${visiblePlaces.length}곳`;

      if (visiblePlaces.length === 0) {
        resultsElement.innerHTML = `
          <div class="empty">
            주변에서 검색 결과를 찾지 못했어요.<br />
            다른 종류를 선택하거나 위치를 바꿔 보세요.
          </div>
        `;
        return;
      }

      resultsElement.innerHTML = visiblePlaces.map((place) => {
        const type = getMarkerType(place);
        const address =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        const distance = place.distance
          ? `${Number(place.distance).toLocaleString()}m`
          : "거리 정보 없음";

        const selectedClass =
          selectedPlaceId === place.id ? "selected" : "";

        const placeUrl = place.place_url || "";

        return `
          <article
            class="place-card ${selectedClass}"
            data-id="${escapeHtml(place.id)}"
            tabindex="0"
            role="button"
            aria-label="${escapeHtml(place.place_name)} 위치 보기"
          >
            <h3>${escapeHtml(place.place_name)}</h3>

            <span class="place-type ${type}">
              ${getTypeLabel(type)}
            </span>

            <p>${escapeHtml(address)}</p>
            <p>거리: ${escapeHtml(distance)}</p>

            ${
              place.phone
                ? `<p>전화: ${escapeHtml(place.phone)}</p>`
                : ""
            }

            ${
              placeUrl
                ? `<a href="${escapeHtml(placeUrl)}"
                    target="_blank"
                    rel="noopener noreferrer">카카오맵에서 보기 ↗</a>`
                : ""
            }
          </article>
        `;
      }).join("");

      resultsElement.querySelectorAll(".place-card").forEach((card) => {
        const openCard = (event) => {
          if (event.target.closest("a")) return;

          const place = visiblePlaces.find(
            (item) => item.id === card.dataset.id
          );

          if (place) selectPlace(place);
        };

        card.addEventListener("click", openCard);

        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openCard(event);
          }
        });
      });
    }

    // =====================================
    // 7. 지도 마커 표시
    // =====================================

    function clearMarkers() {
      markers.forEach((item) => {
        item.marker.setMap(null);
      });

      markers = [];
    }

    function renderMarkers() {
      clearMarkers();

      visiblePlaces.forEach((place) => {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name,
          image: createMarkerImage(place)
        });

        kakao.maps.event.addListener(marker, "click", () => {
          selectPlace(place);
        });

        // 장소 ID와 마커를 연결해 목록 클릭 시에도 정확히 찾기
        markers.push({
          marker: marker,
          placeId: place.id
        });
      });
    }

    // =====================================
    // 8. 장소 선택 및 상세 정보
    // =====================================

    function selectPlace(place) {
      selectedPlaceId = place.id;

      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.panTo(position);

      const markerItem = markers.find(
        (item) => item.placeId === place.id
      );

      const marker = markerItem ? markerItem.marker : null;

      const address =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      const content = `
        <div style="padding:12px;max-width:240px;font-size:13px;line-height:1.5;">
          <strong>${escapeHtml(place.place_name)}</strong>

          <div style="margin-top:5px;color:#666;">
            ${escapeHtml(address)}
          </div>

          <div style="margin-top:5px;color:#777;">
            ${getTypeLabel(getMarkerType(place))}
          </div>

          ${
            place.place_url
              ? `<a href="${escapeHtml(place.place_url)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="display:inline-block;margin-top:7px;color:#3867e8;">
                  상세 정보 보기
                </a>`
              : ""
          }
        </div>
      `;

      infoWindow.setContent(content);

      if (marker) {
        infoWindow.open(map, marker);
      }

      renderResults();
    }

    // =====================================
    // 9. 장소명 또는 주소 검색
    // =====================================

    function searchByText() {
      const query = searchInput.value.trim();

      if (!query) {
        statusElement.textContent =
          "검색할 장소명이나 주소를 입력해 주세요.";

        searchInput.focus();
        return;
      }

      if (!placesService) return;

      statusElement.textContent = `"${query}" 검색 중입니다.`;

      placesService.keywordSearch(query, (data, status) => {
        if (
          status !== kakao.maps.services.Status.OK ||
          !data ||
          data.length === 0
        ) {
          statusElement.textContent = "검색 결과가 없습니다.";
          return;
        }

        const first = data[0];

        currentCenter = new kakao.maps.LatLng(
          Number(first.y),
          Number(first.x)
        );

        map.setCenter(currentCenter);
        map.setLevel(4);

        searchNearby();
      });
    }

    document.getElementById("searchBtn").addEventListener(
      "click",
      searchByText
    );

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        searchByText();
      }
    });

    // =====================================
    // 10. 종류별 필터
    // =====================================

    document.querySelectorAll(".filter-btn").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((item) => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        activeType = button.dataset.type;

        searchNearby();
      });
    });

    // =====================================
    // 11. 현재 위치에서 검색
    // =====================================

    document.getElementById("locationBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다.";
        return;
      }

      statusElement.textContent =
        "현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentCenter = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentCenter);
          map.setLevel(5);

          searchNearby();
        },

        (error) => {
          console.error(error);

          statusElement.textContent =
            "현재 위치를 가져오지 못했습니다. 브라우저의 위치 권한과 접속 환경을 확인해 주세요.";
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    });

    // =====================================
    // 12. 지도 중심으로 돌아가기
    // =====================================

    document.getElementById("centerBtn").addEventListener("click", () => {
      if (!map) return;

      map.setCenter(currentCenter);
      map.setLevel(5);
    });

    // =====================================
    // 13. 교통정보 표시
    // =====================================

    document.getElementById("trafficBtn").addEventListener("click", () => {
      if (!map) return;

      const button = document.getElementById("trafficBtn");
      const trafficType = kakao.maps.MapTypeId.TRAFFIC;

      if (!trafficType) {
        statusElement.textContent =
          "현재 SDK에서 교통정보 기능을 사용할 수 없습니다.";
        return;
      }

      if (!trafficVisible) {
        map.addOverlayMapTypeId(trafficType);

        trafficVisible = true;
        button.classList.add("active");
        button.textContent = "교통정보 숨기기";
      } else {
        map.removeOverlayMapTypeId(trafficType);

        trafficVisible = false;
        button.classList.remove("active");
        button.textContent = "교통정보 표시";
      }
    });

    // =====================================
    // 14. Kakao SDK 로딩
    // =====================================

    if (
      window.kakao &&
      kakao.maps &&
      typeof kakao.maps.load === "function"
    ) {
      kakao.maps.load(initializeMap);
    } else {
      showMapError();
    }
  </script>
</body>
</html>
