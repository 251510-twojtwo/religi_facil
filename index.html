<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다양한 종교 시설 찾기</title>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나누기 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 390px;
            min-width: 320px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background: white;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 18px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 종교 시설 탭 */
        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .tab-button {
            padding: 11px 3px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .tab-button:hover {
            background: #f5f5f5;
        }

        .tab-button.active {
            border-color: #333;
            background: #333;
            color: white;
            font-weight: bold;
        }

        /* 검색창 */
        .search-box {
            display: flex;
            gap: 7px;
        }

        #searchInput {
            width: 0;
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 11px 14px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            font-weight: bold;
            cursor: pointer;
        }

        /* 교통정보와 위치 버튼 */
        .utility-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .utility-button {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: white;
            font-size: 12px;
            cursor: pointer;
        }

        .utility-button:hover {
            background: #f5f5f5;
        }

        /* 마커 색상 안내 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* 검색 상태 메시지 */
        #statusMessage {
            margin: 14px 0 8px;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .place-item {
            padding: 14px 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover,
        .place-item.selected {
            background: #f7f7f7;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-category {
            margin-bottom: 6px;
            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        .place-address {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2675d8;
            font-size: 12px;
            text-decoration: none;
        }

        .place-link:hover {
            text-decoration: underline;
        }

        /* 이전 페이지와 다음 페이지 */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding-top: 12px;
        }

        .pagination button {
            padding: 7px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .pagination button:disabled {
            color: #aaa;
            cursor: not-allowed;
        }

        #pageInfo {
            font-size: 12px;
            color: #555;
        }

        /* 오른쪽 카카오 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #f2f2f2;
        }

        /* 작은 화면에서는 위아래로 배치 */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 55%;
                padding: 14px;
            }

            #map {
                width: 100%;
                height: 45%;
                min-height: 200px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>
