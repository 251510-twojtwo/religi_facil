<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근처 종교 시설 지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 390px;
            min-width: 320px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background: white;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 18px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .tab-button {
            padding: 11px 3px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            cursor: pointer;
        }

        .tab-button.active {
            color: white;
            background: #333;
            border-color: #333;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 7px;
        }

        #searchInput {
            width: 0;
            flex: 1;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        #searchButton {
            padding: 11px 14px;
            border: none;
            border-radius: 8px;
            background: #fee500;
            font-weight: bold;
            cursor: pointer;
        }

        .utility-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .utility-button {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: white;
            font-size: 12px;
            cursor: pointer;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        #statusMessage {
            margin: 14px 0 8px;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .place-item {
            padding: 14px 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover,
        .place-item.selected {
            background: #f7f7f7;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-category {
            margin-bottom: 6px;
            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        .place-address {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-phone {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
        }

        .place-link {
            display: inline-block;
            margin-top: 8px;
            color: #2675d8;
            font-size: 12px;
            text-decoration: none;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding-top: 12px;
        }

        .pagination button {
            padding: 7px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .pagination button:disabled {
            color: #aaa;
            cursor: not-allowed;
        }

        #pageInfo {
            font-size: 12px;
            color: #555;
        }

        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #f2f2f2;
        }

        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 55%;
                padding: 14px;
            }

            #map {
                width: 100%;
                height: 45%;
                min-height: 200px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <!-- 왼쪽: 검색 탭과 결과 목록 -->
    <aside class="sidebar">
        <h1>종교 시설 찾기</h1>

        <p class="description">
            새로운 장소에서도 나에게 맞는 종교 시설을 찾아보세요.
        </p>

        <div class="tabs">
            <button class="tab-button active" data-tab="temple">절</button>
            <button class="tab-button" data-tab="cathedral">성당</button>
            <button class="tab-button" data-tab="church">교회</button>
            <button class="tab-button" data-tab="other">그 외</button>
        </div>

        <div class="search-box">
            <input
                id="searchInput"
                type="text"
                placeholder="장소 이름이나 검색어 입력"
                aria-label="검색할 장소"
            >
            <button id="searchButton">검색</button>
        </div>

        <div class="utility-buttons">
            <button id="locationButton" class="utility-button">
                현재 위치로 이동
            </button>

            <button id="trafficButton" class="utility-button">
                교통정보 켜기
            </button>
        </div>

        <div class="legend">
            <span class="legend-item">
                <span class="legend-dot" style="background:#d9534f"></span>
                절
            </span>
            <span class="legend-item">
                <span class="legend-dot" style="background:#3678c8"></span>
                성당
            </span>
            <span class="legend-item">
                <span class="legend-dot" style="background:#2f9963"></span>
                교회
            </span>
            <span class="legend-item">
                <span class="legend-dot" style="background:#9467bd"></span>
                그 외
            </span>
        </div>

        <p id="statusMessage" role="status" aria-live="polite">
            카카오 지도를 불러오는 중입니다.
        </p>

        <div id="resultList"></div>

        <div class="pagination">
            <button id="previousButton" disabled>이전</button>
            <span id="pageInfo">1 / 1</span>
            <button id="nextButton" disabled>다음</button>
        </div>
    </aside>

    <!-- 오른쪽: 카카오 지도 -->
    <main id="map" aria-label="주변 종교 시설 지도"></main>
</div>

<!-- 카카오 지도 SDK: JavaScript 키 적용 -->
<script
    id="kakaoSdk"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e8464b7932c46b8e4dbfb556fec74039&libraries=services&autoload=false"
    async
    onerror="showSdkError()"
></script>

<script>
    // ==========================================
    // 1. 공통 변수
    // ==========================================

    let map;
    let places;
    let infoWindow;

    let currentMarker = null;
    let placeMarkers = [];

    let currentPosition = null;
    let defaultPosition = null;

    let mapReady = false;
    let sdkLoadFailed = false;
    let trafficEnabled = false;

    let activeTab = "temple";
    let allPlaces = [];
    let currentPage = 1;

    const pageSize = 5;

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const statusMessage = document.getElementById("statusMessage");
    const resultList = document.getElementById("resultList");

    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");

    const locationButton = document.getElementById("locationButton");
    const trafficButton = document.getElementById("trafficButton");

    const tabButtons = document.querySelectorAll(".tab-button");

    // 탭마다 사용할 검색어
    const tabKeywords = {
        temple: ["불교 종교 시설", "절", "사찰"],
        cathedral: ["성당"],
        church: ["교회"],
        other: ["종교 기관", "회당", "기도원", "원불교", "이슬람 사원", "천도교"]
    };

    const tabNames = {
        temple: "절",
        cathedral: "성당",
        church: "교회",
        other: "그 외 종교 시설"
    };

    // ==========================================
    // 2. 카카오 SDK 로딩 확인
    // ==========================================

    let sdkWaitCount = 0;

    function waitForKakao() {
        if (sdkLoadFailed) {
            return;
        }

        if (
            !window.kakao ||
            !window.kakao.maps ||
            !window.kakao.maps.load
        ) {
            sdkWaitCount++;

            if (sdkWaitCount > 300) {
                showSdkError();
                return;
            }

            setTimeout(waitForKakao, 100);
            return;
        }

        kakao.maps.load(initializeMap);
    }

    function showSdkError() {
        sdkLoadFailed = true;
        mapReady = false;

        statusMessage.textContent =
            "카카오 지도를 불러오지 못했습니다. JavaScript 키와 등록 도메인을 확인해 주세요.";
    }

    // ==========================================
    // 3. 지도 초기화
    // ==========================================

    function initializeMap() {
        try {
            // 기본 위치는 서울 시청
            defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            // 지도 확대 레벨 5로 설정
            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            // 장소 검색과 정보 팝업 생성
            places = new kakao.maps.services.Places(map);

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            mapReady = true;

            statusMessage.textContent =
                "현재 위치를 확인하고 있습니다.";

            // 페이지가 열리면 위치 권한 요청
            getCurrentLocation();

        } catch (error) {
            statusMessage.textContent =
                "지도 초기화에 실패했습니다. 카카오 API 설정을 확인해 주세요.";

            console.error(error);
        }
    }

    // ==========================================
    // 4. 현재 위치 가져오기
    // ==========================================

    function getCurrentLocation() {
        if (!mapReady) {
            return;
        }

        if (!navigator.geolocation) {
            currentPosition = defaultPosition;
            map.setCenter(defaultPosition);

            statusMessage.textContent =
                "위치 기능을 사용할 수 없어 서울 시청을 기준으로 검색합니다.";

            searchTab(activeTab);
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function (position) {
                // 위치 확인 성공
                currentPosition = new kakao.maps.LatLng(
                    position.coords.latitude,
                    position.coords.longitude
                );

                map.setCenter(currentPosition);

                if (currentMarker) {
                    currentMarker.setMap(null);
                }

                // 현재 위치 마커
                currentMarker = new kakao.maps.Marker({
                    position: currentPosition,
                    map: map
                });

                statusMessage.textContent =
                    "현재 위치를 확인했습니다. 주변 종교 시설을 검색합니다.";

                searchTab(activeTab);
            },

            function (error) {
                // 위치를 가져오지 못하면 기본 위치 사용
                currentPosition = defaultPosition;
                map.setCenter(defaultPosition);

                if (error.code === 1) {
                    statusMessage.textContent =
                        "위치 권한이 거부되었습니다. 서울 시청을 기준으로 검색합니다.";
                } else {
                    statusMessage.textContent =
                        "현재 위치를 확인하지 못했습니다. 서울 시청을 기준으로 검색합니다.";
                }

                searchTab(activeTab);
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 60000
            }
        );
    }

    // ==========================================
    // 5. 탭별 종교 시설 검색
    // ==========================================

    function searchTab(tabName) {
        if (!mapReady || !places) {
            statusMessage.textContent =
                "지도를 불러오는 중입니다. 잠시 기다려 주세요.";
            return;
        }

        activeTab = tabName;
        searchInput.value = "";

        // 현재 탭 강조 표시
        tabButtons.forEach(function (button) {
            button.classList.toggle(
                "active",
                button.dataset.tab === tabName
            );
        });

        clearSearchResults();

        statusMessage.textContent =
            tabNames[tabName] + "을(를) 검색하고 있습니다.";

        const keywords = tabKeywords[tabName];

        Promise.all(
            keywords.map(function (keyword) {
                return searchKeyword(keyword);
            })
        )
        .then(function (resultGroups) {
            // 여러 검색 결과를 하나로 합치기
            let combinedResults = resultGroups.flat();

            // 같은 장소가 중복되면 한 번만 표시
            const seenIds = new Set();

            combinedResults = combinedResults.filter(function (place) {
                if (seenIds.has(place.id)) {
                    return false;
                }

                seenIds.add(place.id);
                return true;
            });

            // 선택한 탭의 목적에 맞는 장소만 남기기
            combinedResults = combinedResults.filter(function (place) {
                return matchesTab(place, tabName);
            });

            // 현재 위치에서 가까운 순서로 정렬
            combinedResults.sort(function (a, b) {
                return getDistanceFromCurrent(a) -
                       getDistanceFromCurrent(b);
            });

            allPlaces = combinedResults;
            currentPage = 1;

            renderCurrentPage();

            if (allPlaces.length === 0) {
                statusMessage.textContent =
                    "검색 결과가 없습니다. 다른 탭을 선택하거나 검색어를 바꿔 보세요.";
            } else {
                statusMessage.textContent =
                    tabNames[tabName] + " 검색 결과 " +
                    allPlaces.length + "개를 찾았습니다.";
            }
        })
        .catch(function (error) {
            statusMessage.textContent =
                "검색 중 오류가 발생했습니다. 네트워크와 API 설정을 확인해 주세요.";

            console.error(error);
        });
    }

    // ==========================================
    // 6. 카카오 장소 키워드 검색
    // ==========================================

    function searchKeyword(keyword) {
        return new Promise(function (resolve, reject) {
            const searchCenter = currentPosition || defaultPosition;

            places.keywordSearch(
                keyword,
                function (data, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        resolve(data || []);
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        resolve([]);
                    } else {
                        reject(new Error("장소 검색 실패: " + keyword));
                    }
                },
                {
                    location: searchCenter,
                    radius: 5000,
                    sort: kakao.maps.services.SortBy.DISTANCE,
                    size: 15
                }
            );
        });
    }

    // ==========================================
    // 7. 탭에 맞는 장소인지 확인
    // ==========================================

    function matchesTab(place, tabName) {
        const name = (place.place_name || "").toLowerCase();
        const category = (place.category_name || "").toLowerCase();
        const text = name + " " + category;

        if (tabName === "temple") {
            return (
                text.includes("절") ||
                text.includes("사찰") ||
                text.includes("불교")
            ) &&
            !text.includes("성당") &&
            !text.includes("교회");
        }

        if (tabName === "cathedral") {
            return text.includes("성당");
        }

        if (tabName === "church") {
            return text.includes("교회") &&
                   !text.includes("성당");
        }

        if (tabName === "other") {
            const isTemple =
                text.includes("절") ||
                text.includes("사찰") ||
                text.includes("불교");

            const isCathedral =
                text.includes("성당") ||
                text.includes("천주교");

            const isChurch =
                text.includes("교회") ||
                text.includes("기독교") ||
                text.includes("개신교") ||
                text.includes("예배당");

            const isOtherReligion =
                text.includes("종교") ||
                text.includes("기도원") ||
                text.includes("회당") ||
                text.includes("원불교") ||
                text.includes("천도교") ||
                text.includes("이슬람") ||
                text.includes("성원") ||
                text.includes("교당");

            return isOtherReligion &&
                   !isTemple &&
                   !isCathedral &&
                   !isChurch;
        }

        return true;
    }

    // ==========================================
    // 8. 현재 위치에서 장소까지의 거리 계산
    // ==========================================

    function getDistanceFromCurrent(place) {
        const center = currentPosition || defaultPosition;

        const lat1 = center.getLat();
        const lon1 = center.getLng();
        const lat2 = Number(place.y);
        const lon2 = Number(place.x);

        function toRadians(degrees) {
            return degrees * Math.PI / 180;
        }

        const dLat = toRadians(lat2 - lat1);
        const dLon = toRadians(lon2 - lon1);

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(toRadians(lat1)) *
            Math.cos(toRadians(lat2)) *
            Math.sin(dLon / 2) ** 2;

        return 6371 * 2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
    }

    // ==========================================
    // 9. 이전 검색 결과 제거
    // ==========================================

    function clearSearchResults() {
        placeMarkers.forEach(function (marker) {
            marker.setMap(null);
        });

        placeMarkers = [];
        allPlaces = [];
        currentPage = 1;

        resultList.replaceChildren();

        if (infoWindow) {
            infoWindow.close();
        }

        updatePagination();
    }

    // ==========================================
    // 10. 현재 페이지 표시
    // ==========================================

    function renderCurrentPage() {
        // 페이지를 바꾸면 이전 페이지의 마커를 제거
        placeMarkers.forEach(function (marker) {
            marker.setMap(null);
        });

        placeMarkers = [];
        resultList.replaceChildren();

        if (infoWindow) {
            infoWindow.close();
        }

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(
            startIndex + pageSize,
            allPlaces.length
        );

        const pagePlaces = allPlaces.slice(startIndex, endIndex);
        const bounds = new kakao.maps.LatLngBounds();

        pagePlaces.forEach(function (place, index) {
            const position = new kakao.maps.LatLng(
                Number(place.y),
                Number(place.x)
            );

            bounds.extend(position);

            // 탭별로 서로 다른 마커 색상 적용
            const markerImage = createMarkerImage(
                getMarkerColor(place)
            );

            const marker = new kakao.maps.Marker({
                position: position,
                map: map,
                image: markerImage
            });

            placeMarkers.push(marker);

            // 마커를 클릭하면 상세 팝업 표시
            kakao.maps.event.addListener(marker, "click", function () {
                showPlaceInfo(place, position, marker);
            });

            // 검색 결과 목록 만들기
            const item = document.createElement("article");
            item.className = "place-item";
            item.tabIndex = 0;

            const name = document.createElement("div");
            name.className = "place-name";
            name.textContent =
                (startIndex + index + 1) + ". " + place.place_name;

            item.appendChild(name);

            if (place.category_name) {
                const category = document.createElement("div");
                category.className = "place-category";
                category.textContent = place.category_name;
                item.appendChild(category);
            }

            const address = document.createElement("div");
            address.className = "place-address";
            address.textContent = getPlaceAddress(place);
            item.appendChild(address);

            if (place.phone) {
                const phone = document.createElement("div");
                phone.className = "place-phone";
                phone.textContent = "전화: " + place.phone;
                item.appendChild(phone);
            }

            if (place.place_url) {
                const link = document.createElement("a");
                link.className = "place-link";
                link.href = place.place_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "카카오맵에서 보기";

                link.addEventListener("click", function (event) {
                    event.stopPropagation();
                });

                item.appendChild(link);
            }

            // 목록 클릭 시 지도 이동
            item.addEventListener("click", function () {
                selectPlace(item, place, position, marker);
            });

            // Enter 키로도 장소 선택
            item.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    selectPlace(item, place, position, marker);
                }
            });

            resultList.appendChild(item);
        });

        // 현재 페이지의 장소가 지도에 보이도록 설정
        if (pagePlaces.length === 1) {
            map.setCenter(new kakao.maps.LatLng(
                Number(pagePlaces[0].y),
                Number(pagePlaces[0].x)
            ));
        } else if (pagePlaces.length > 1) {
            map.setBounds(bounds);
        }

        updatePagination();
    }

    // ==========================================
    // 11. 목록에서 장소 선택
    // ==========================================

    function selectPlace(item, place, position, marker) {
        document.querySelectorAll(".place-item").forEach(function (element) {
            element.classList.remove("selected");
        });

        item.classList.add("selected");

        map.panTo(position);
        showPlaceInfo(place, position, marker);
    }

    // ==========================================
    // 12. 주소 표시
    // ==========================================

    function getPlaceAddress(place) {
        return (
            place.road_address_name ||
            place.address_name ||
            "주소 정보 없음"
        );
    }

    // ==========================================
    // 13. 탭별 마커 색상
    // ==========================================

    function getMarkerColor(place) {
        if (activeTab === "temple") {
            return "#d9534f";
        }

        if (activeTab === "cathedral") {
            return "#3678c8";
        }

        if (activeTab === "church") {
            return "#2f9963";
        }

        return "#9467bd";
    }

    // ==========================================
    // 14. 마커 이미지 만들기
    // ==========================================

    function createMarkerImage(color) {
        const svg =
            '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">' +
            '<path d="M16 1 C7.7 1 1 7.7 1 16 C1 26 16 41 16 41 C16 41 31 26 31 16 C31 7.7 24.3 1 16 1Z" fill="' +
            color +
            '" stroke="#ffffff" stroke-width="2"/>' +
            '<circle cx="16" cy="16" r="5" fill="#ffffff"/>' +
            '</svg>';

        const imageUrl =
            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(svg);

        return new kakao.maps.MarkerImage(
            imageUrl,
            new kakao.maps.Size(32, 42),
            {
                offset: new kakao.maps.Point(16, 42)
            }
        );
    }

    // ==========================================
    // 15. 마커 상세 팝업
    // ==========================================

    function showPlaceInfo(place, position, marker) {
        const name = escapeHTML(
            place.place_name || "장소 이름 없음"
        );

        const address = escapeHTML(getPlaceAddress(place));
        const phone = escapeHTML(place.phone || "");

        let content =
            '<div style="padding:12px;width:240px;font-size:13px;line-height:1.6;">' +
            '<strong style="display:block;margin-bottom:6px;font-size:15px;">' +
            name +
            '</strong>' +
            '<div style="color:#555;">' + address + '</div>';

        if (phone) {
            content +=
                '<div style="margin-top:5px;">전화: ' +
                phone +
                '</div>';
        }

        if (place.place_url) {
            content +=
                '<a href="' + escapeHTML(place.place_url) +
                '" target="_blank" rel="noopener noreferrer" ' +
                'style="display:inline-block;margin-top:8px;color:#2675d8;">' +
                '카카오맵에서 보기</a>';
        }

        content += "</div>";

        infoWindow.setContent(content);

        // 클릭한 마커 위에 팝업 표시
        infoWindow.open(map, marker);

        map.panTo(position);
    }

    // 팝업에 표시하는 문자열의 HTML 특수문자 처리
    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ==========================================
    // 16. 페이지 버튼 업데이트
    // ==========================================

    function updatePagination() {
        const totalPages = Math.max(
            1,
            Math.ceil(allPlaces.length / pageSize)
        );

        pageInfo.textContent =
            currentPage + " / " + totalPages;

        previousButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= totalPages;
    }

    previousButton.addEventListener("click", function () {
        if (currentPage > 1) {
            currentPage--;
            renderCurrentPage();
        }
    });

    nextButton.addEventListener("click", function () {
        const totalPages = Math.ceil(allPlaces.length / pageSize);

        if (currentPage < totalPages) {
            currentPage++;
            renderCurrentPage();
        }
    });
